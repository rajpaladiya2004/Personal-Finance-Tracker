{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Personal Finance Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a class="brand" href="{% url 'expenses:home' %}">
                <span class="brand-mark">PF</span>
                <span class="brand-text">Personal Finance Tracker</span>
            </a>

            <div class="nav-links">
                <a class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'expenses:home' %}">Home</a>
                <a class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'expenses:dashboard' %}">Dashboard</a>
                <a class="{% if request.resolver_match.url_name == 'transaction_list' %}active{% endif %}" href="{% url 'expenses:transaction_list' %}">Transactions</a>
                <a class="{% if request.resolver_match.url_name == 'category_list' %}active{% endif %}" href="{% url 'expenses:category_list' %}">Categories</a>
                <a class="{% if request.resolver_match.url_name == 'contact_us' %}active{% endif %}" href="{% url 'expenses:contact_us' %}">Contact Us</a>
            </div>
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <p class="message {% if message.tags %}message-{{ message.tags }}{% endif %}">{{ message }}</p>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
