{% extends 'base.html' %}

{% block title %}Login - Personal Finance Tracker{% endblock %}

{% block content %}
    <section class="login-page">
        <div class="login-card">
            <h1>Login</h1>

            <form method="POST" class="login-form">
                {% csrf_token %}

                <p>
                    <label for="{{ form.username.id_for_label }}">Email or Username:</label>
                    {{ form.username }}
                    {{ form.username.errors }}
                </p>

                <p>
                    <label for="{{ form.password.id_for_label }}">Password:</label>
                    {{ form.password }}
                    {{ form.password.errors }}
                </p>

                <button type="submit">Login</button>
            </form>

            <p class="login-footer">Don't have an account? <a href="{% url 'expenses:register' %}">Register here</a></p>
        </div>
    </section>
{% endblock %}
